name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build backend wheel
        run: uv build --out-dir wheelhouse

      - name: Assemble release bundle
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#refs/tags/}"
          [ -n "$TAG" ] || TAG="dev-${GITHUB_SHA::7}"
          NAME="codex-ai-gateway-${TAG}"
          mkdir -p "bundle/${NAME}/wheels"
          cp -r dist "bundle/${NAME}/dist"
          cp wheelhouse/*.whl "bundle/${NAME}/wheels/"
          cp README.md "bundle/${NAME}/README.md"
          cp -r scripts "bundle/${NAME}/scripts"
          cd bundle
          zip -qr "${NAME}.zip" "${NAME}"
          SHA=$(sha256sum "${NAME}.zip" | cut -d' ' -f1)
          cat > latest.json <<JSON
          {
            "version": "${TAG}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes_url": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}",
            "assets": [
              {
                "name": "${NAME}.zip",
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}.zip",
                "sha256": "${SHA}"
              }
            ]
          }
          JSON
          echo "${SHA}  ${NAME}.zip" > SHA256SUMS
          echo "BUNDLE_ZIP=${NAME}.zip" >> "$GITHUB_ENV"
          echo "BUNDLE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE_ZIP }}
          path: |
            bundle/${{ env.BUNDLE_ZIP }}
            bundle/latest.json
            bundle/SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${BUNDLE_TAG}" \
            --title "Codex AI Gateway ${BUNDLE_TAG}" \
            --generate-notes \
            "bundle/${BUNDLE_ZIP}" \
            "bundle/latest.json" \
            "bundle/SHA256SUMS"