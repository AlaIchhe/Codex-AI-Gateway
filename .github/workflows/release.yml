name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build backend wheel
        run: uv build --out-dir wheelhouse

      - name: Assemble release bundle
        shell: bash
        run: |
          NAME="codex-ai-gateway-${GITHUB_REF_NAME#refs/tags/}"
          mkdir -p "bundle/${NAME}/wheels"
          cp -r dist "bundle/${NAME}/dist"
          cp wheelhouse/*.whl "bundle/${NAME}/wheels/"
          cp README.md "bundle/${NAME}/README.md"
          cd bundle
          zip -r "${NAME}.zip" "${NAME}"
          echo "BUNDLE_ZIP=${NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE_ZIP }}
          path: bundle/${{ env.BUNDLE_ZIP }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME#refs/tags/}" \
            --title "Codex AI Gateway ${GITHUB_REF_NAME#refs/tags/}" \
            --generate-notes \
            "bundle/${BUNDLE_ZIP}"
